# Render Blueprint for Quorum (PLAN S1.4). Sandbox only.
# Secrets are `sync: false`: Render asks for their values when the Blueprint is applied and never
# reads them from this file. Every key here is documented in .env.example.
# Services deploy the branch the Blueprint is linked to (chosen in the Render dashboard).

databases:
  - name: quorum-db
    databaseName: quorum
    user: quorum
    plan: basic-256mb # not "free": free Postgres expires, and judging runs to Dec 15
    region: oregon
    postgresMajorVersion: "17"
    ipAllowList: [] # private network only: reachable from quorum-web / quorum-worker, not the internet

services:
  - type: web
    name: quorum-web
    runtime: node
    plan: starter # no spin-down; upgrade or keep warm for Dec 1–15 (PLAN S5.4)
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start:web
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID # leave empty on first deploy; set after creating the webhook
        sync: false
      - key: VITE_AG_STUDIO_LICENSE_KEY # build-time; bundled into the frontend
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: quorum-db
          property: connectionString

  - type: worker
    name: quorum-worker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start:worker
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: quorum-db
          property: connectionString
